<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-driver);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .flex-row {
            display: flex;
            gap: 1rem;
        }

        .text-center {
            text-align: center;
        }

        .text-link {
            color: var(--color-driver);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        .text-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .dash-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            background: #fef3c7;
            color: #d97706;
            margin-left: 1rem;
        }

        .status-badge.online {
            background: #d1fae5;
            color: #059669;
        }
    </style>
</head>

<body>
    <div id="app" class="fade-in">
        <div id="auth-view" class="auth-container">
            <h2 class="text-center" style="margin-bottom: 2rem;">🚑 Driver Login</h2>

            <div id="login-form">
                <div class="form-group"><label>User ID</label><input type="text" id="login-userid"></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-pwd"></div>
                <button class="btn btn-driver" onclick="doLogin()">Login</button>
                <p class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem;">
                    Don't have an account? <span class="text-link" onclick="toggleAuth('register')">Register here</span>
                </p>
                <div class="text-center" style="margin-top: 1rem;"><button class="btn"
                        style="background:#e2e8f0; color:#333;" onclick="location.href='/'">Back to Roles</button></div>
            </div>

            <div id="register-form" class="hidden">
                <div class="form-group"><label>Full Name</label><input type="text" id="reg-name"></div>
                <div class="flex-row">
                    <div class="form-group" style="flex:1;"><label>Contact</label><input type="text" id="reg-contact">
                    </div>
                    <div class="form-group" style="flex:1;"><label>Vehicle Type</label>
                        <select id="reg-type">
                            <option>Ambulance</option>
                            <option>Emergency Van</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Vehicle Number</label><input type="text" id="reg-num"></div>
                <div class="form-group"><label>User ID</label><input type="text" id="reg-userid"></div>
                <div class="flex-row">
                    <div class="form-group" style="flex:1;"><label>Password</label><input type="password" id="reg-pwd">
                    </div>
                    <div class="form-group" style="flex:1;"><label>Confirm</label><input type="password" id="reg-cpwd">
                    </div>
                </div>
                <button class="btn btn-driver" onclick="doRegister()">Register</button>
                <p class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem;">
                    Already have an account? <span class="text-link" onclick="toggleAuth('login')">Login here</span>
                </p>
            </div>
        </div>

        <div id="dashboard-view" class="dash-container hidden">
            <div class="auth-container" style="max-width: 100%;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                    <div style="display:flex; align-items:center;">
                        <h2>🚑 <span id="dash-name">Driver</span> Dashboard</h2>
                        <span id="dash-status" class="status-badge">Offline</span>
                    </div>
                    <button class="btn" style="background:#ef4444; color:#fff; width: auto;"
                        onclick="logout()">Logout</button>
                </div>

                <div style="display:flex; gap: 2rem; flex-wrap:wrap;">
                    <!-- Controls -->
                    <div
                        style="flex:1; min-width:300px; background:var(--bg-main); padding: 1.5rem; border-radius:12px;">
                        <h3>Driver Controls</h3>
                        <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Your live location is
                            simulated using browser geo settings.</p>

                        <div style="display:flex; gap:1rem; margin-bottom:1rem;">
                            <button class="btn btn-driver" onclick="setStatus('available')">Go Online</button>
                            <button class="btn btn-driver" style="background:#ef4444;" onclick="setStatus('offline')">Go
                                Offline</button>
                        </div>
                        <div style="margin-bottom:1rem;">
                            <p>Affiliated Hospital:</p>
                            <h4 id="dash-hospital" style="color:var(--color-driver);">Not Affiliated</h4>
                        </div>
                    </div>

                    <!-- Simulating requests -->
                    <div
                        style="flex:1; min-width:300px; background:var(--bg-main); padding: 1.5rem; border-radius:12px;">
                        <h3>Active Dispatch Requests</h3>
                        <div id="driver-requests" style="margin-top:1rem;">
                            <p style="color:var(--text-muted)">No active dispatch requests.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/driver.js"></script>
</body>

</html>
